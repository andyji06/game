<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 크로스헤어 (조준점) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before {
            top: 4px; left: -5px; width: 20px; height: 2px;
        }
        #crosshair::after {
            top: -5px; left: 4px; width: 2px; height: 20px;
        }

        /* UI 레이어 */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* 시작 / 게임오버 화면 overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #overlay p {
            font-size: 20px;
            margin: 5px 0;
            color: #ccc;
        }

        #overlay .start-btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 22px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        #overlay .start-btn:hover {
            background: #45a049;
        }
    </style>
    <!-- Three.js (3D 렌더링 라이브러리) 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    
    <div id="ui">
        점수: <span id="score">0</span>
    </div>

    <div id="overlay">
        <h1 id="title">3D FPS 타겟 슈팅</h1>
        <p>조작법: <strong>W, A, S, D</strong> (이동) | <strong>마우스</strong> (시점 회전) | <strong>클릭</strong> (발사)</p>
        <p>ESC 키를 누르면 마우스 커서가 해제됩니다.</p>
        <button class="start-btn" id="start-btn">게임 시작</button>
    </div>

    <script>
        // --- 게임 변수 및 설정 ---
        let scene, camera, renderer;
        let targets = [];
        let bullets = [];
        let score = 0;
        let isLocked = false;

        // 플레이어 이동 속도 및 방향
        const moveState = { forward: false, backward: false, left: false, right: false };
        const moveSpeed = 0.15;
        
        // 시점 회전 관련 변수 (Euler Angles)
        let yaw = 0;
        let pitch = 0;

        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const scoreElement = document.getElementById('score');

        // --- 초기화 함수 ---
        function init() {
            // 1. Scene 작성
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

            // 2. Camera 설정
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // 눈높이 위치

            // 3. Renderer 설정
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. 조명 설정
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0
